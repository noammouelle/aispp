# MAGIS-100 (Abe et al., QST 6, 044003 (2021), arXiv:2104.02835; beam
# delivery: Glick et al., arXiv:2311.05714).
#
# Status of each number (see ANALYSIS.md):
#   confirmed  - ~100 m vertical baseline in the MINOS shaft at Fermilab;
#                three Sr sources at top, middle and bottom; 698 nm clock
#                beam from the top; in-vacuum tip-tilt mirror before an
#                f = 150 mm / 4500 mm telescope (~300 um -> ~1 cm waist);
#                tip-tilt retro-reflection mirror in a chamber at the bottom;
#                octagonal mu-metal shield; 6-inch vacuum tube.
#                single-layer octagonal shield, bias field from coil *bars* running
#                along the tube (1 G horizontal bias); the same lattice beams
#                shuttle atoms out of the source and launch them (fibre switch).
#   unverified - exact source heights (50 m assumed for the middle one),
#                which side the sidearms are on.
#   trajectories show the "drop" mode (top and middle clouds fall ~50 m);
#                MAGIS also plans short upward launches detected at their origin.
extends: generic.yaml

output:
  name: magis100

layout:
  overview: {letter: [-3.3, 17.75]}

instrument:
  name: MAGIS-100
  baseline: 100
  nodes:
    - {id: bottom, z: 0, source: left}
    - {id: middle, z: 50, source: left}
    - {id: top, z: 100, source: left}
  beam: {arrows_at: [0.86, 0.3]}
  atoms:
    trajectories:   # drop mode: two clouds released, each falling ~50 m
      - {id: top, start: 98, apex: 98, end: 53, dx: 0.03}
      - {id: middle, start: 48, apex: 48, end: 3, dx: -0.03}

overview:
  labels:
    - {text: 'Sr source\,+\,sidearm', anchor: source:top.oven, side: top, dy: 0.13}
    - {text: in-vacuum tip--tilt\\steering mirror, anchor: fold, side: left}
    - {text: 'telescope\\$f = 150\,$mm$\,/\,4.5\,$m', anchor: telescope, side: right}
    - {text: 'launch\,/\,detection\\node (×3)', anchor: node:top, side: right}
    - {text: 'common clock beam\\(698\,nm, $w_0\approx1\,$cm)', anchor: beam, side: right}
    - {text: 6-inch UHV tube, anchor: tube@72, side: right}
    - {text: bias coil bars, anchor: coil@66, side: right}
    - {text: octagonal mu-metal\\shield (single layer), anchor: shield@60, side: right}
    - {text: tip--tilt retro-reflection\\mirror (in vacuum), anchor: mirror, side: right}
  markers:
    - {n: 1, anchor: source:middle.mot, dy: 0.5}
    - {n: 2, anchor: arm:middle, dy: 0.42}
    - {n: 3, anchor: tube@25, dx: 0.45}
    - {n: 4, anchor: node:bottom.camera, dx: 0.05, dy: 0.32}
  zoom: {node: middle, section_z: 80}
  scale_bar: {label: '$\approx$100 m (MINOS shaft)', at: 0.27}

node:
  below: tube          # (b) is the middle node: shielded tube continues below
  labels:
    - {text: 'oven\,/\,2D MOT', anchor: oven, side: top}
    - {text: 3D MOT, anchor: mot, side: top}
    - {text: lattice shuttle, anchor: transport, side: bottom, shift: -0.45}
    - {text: 'lattice launch\\(same beams, switched)', anchor: launch, side: right, shift: -0.25}
    - {text: fluorescence camera, anchor: camera, side: right}
    - {text: clock beam, anchor: beam, side: right}
    - {text: falling atoms, anchor: atoms, side: right}

section:
  layers:
    - {kind: square, size: 1.45, thickness: 0.07, label: support frame}
    - {kind: ring, radius: 1.15, thickness: 0.07, sides: 8, color: shield, label: octagonal mu-metal shield}
    - {kind: coils, radius: 0.85, count: 16, wire: 0.045, label: bias coil bars}
    - {kind: ring, radius: 0.62, thickness: 0.07, color: metal, label: 6-inch vacuum tube}
    - {kind: vacuum, radius: 0.55}
    - {kind: beam, radius: 0.24, label: '698\,nm beam, $w_0\approx1\,$cm'}
    - {kind: atoms, radius: 0.07, label: Sr atoms, side: left}
