# ---------------------------------------------------------------------------
# detfig defaults: every key the generator understands, with its default.
#
# Your own config only needs the keys you want to change (start it with
# `extends: generic.yaml` or similar).  Dictionaries merge key by key; lists
# (nodes, labels, markers, layers, ...) are replaced as a whole.
#
# Units: `z`, `baseline`, `apex` etc. are physical metres.  Everything else
# (radii, widths, offsets) is centimetres on the page.  The horizontal
# direction is deliberately NOT to scale - a 15 cm tube on a 100 m tower
# would be invisible.
#
# Colours are HTML hex codes without '#'.  Wherever a colour is asked for
# you can give either one of the names under style.colors (e.g. `shield`)
# or any TikZ colour expression (e.g. `red!60!black`).
#
# Label text is LaTeX: `$^{87}$Sr`, `\\` for a line break, etc.
# ---------------------------------------------------------------------------

output:
  name: detector_overview   # basename of the .tex/.pdf/.png written
  png_dpi: 300               # 0 disables the PNG preview

document:
  font: \sffamily\footnotesize
  scale: 1.0                 # scales geometry (not text) of the whole picture
  border: 3pt
  preamble: ""               # extra LaTeX for the standalone preamble

layout:
  panels: [overview, node, section]   # any of overview, node, section, trajectory
  panel_letters: true
  zoom_indicators: true      # dashed box (b) and section line (c) in panel (a)
  letter_style: \bfseries\small
  # Offset (cm) of each panel's own coordinate frame.  `letter: [x, y]`
  # (in the panel's frame) overrides where the panel letter goes.
  overview: {x: 0.0, y: 0.0, letter: null}
  node: {x: 11.0, y: 9.6, letter: null}
  section: {x: 9.6, y: 2.6, letter: null}
  trajectory: {x: 5.6, y: 10.0, letter: null}

style:
  line_width: 0.4            # pt, default stroke width
  wall: 0.05                 # cm, wall thickness of vacuum hardware (overview)
  depth: 0.55                # 0 = flat, 1 = strong pseudo-3D shading of interiors
  colors:
    metal: "8E979F"          # vacuum walls
    interior: "F3F6F9"       # inside of the vacuum system
    beam: "D7301F"           # interferometry beam (698 nm)
    lattice: "E08A00"        # transport / launch lattices
    cooling: "3B6FD4"        # MOT beams (461 nm)
    atoms: "1F3A8A"
    shield: "4F86B5"
    coil: "B5651D"
    support: "9A9A9A"
    optics: "5C6B7A"
    laser: "3A3A3A"
    leader: "6A6A6A"
    marker: "222222"
    text: "1A1A1A"

instrument:
  name: Generic long-baseline atom interferometer
  baseline: 100              # m, height of the highest node above the lowest
  # Launch/detection nodes along the vertical tube: {id, z, source, camera}.
  # `source` is the side of the attached atom-source sidearm (left, right or
  # none); `camera: false` omits the node camera.
  nodes:
    - {id: lower, z: 0, source: left}
    - {id: upper, z: 100, source: left}
  # Extra tube beyond the outermost nodes, [z_bottom, z_top] in m; null = the
  # tube ends at the outermost nodes.  (AION-10: nodes at 0 and 5 m of 10 m.)
  tube_extent: null
  tube:
    radius: 0.2              # cm, inner radius as drawn
  shield:
    show: true
    gap: 0.1                 # cm between tube wall and shield (coils sit here)
    thickness: 0.045
    layers: 1                # number of shield layers drawn
    spacing: 0.07            # cm between layers
  coils:
    show: true
    style: bars              # bars (conductors along the tube, transverse bias) | turns (solenoid)
    pitch: 0.3               # cm between drawn windings (turns only)
  support:
    show: false              # dashed structural frame outside the shield
    offset: 0.12
  laser:
    show: true
    side: right              # side of the laser lab / beam-conditioning pipe
    # direct:    laser -> horizontal pipe -> fold mirror -> telescope (MAGIS-like)
    # periscope: laser -> input arm at height input_z -> steering mirror in a
    #            cross -> vertical conditioning pipe at `offset` from the axis
    #            -> two-mirror transfer pipe across the top (AION-like)
    route: direct
    pipe_length: 1.6         # cm, horizontal pipe (direct) or input arm (periscope)
    offset: 1.0              # cm, periscope: distance of the conditioning pipe from the axis
    input_z: null            # m, periscope: height of the input arm (null: just above the bottom)
    tip_tilt_on: axis        # periscope: which top mirror is tip-tilt: axis | transfer
    box_width: 1.5           # cm
    box_height: 0.64         # cm
    text: stabilised\\clock laser   # text inside the laser box
  telescope:
    show: true
    length: 0.9              # cm
  # Two independently actuated mirrors (cf. Glick et al., arXiv:2311.05714):
  # the steering mirror folds the beam into the telescope at the top; the
  # retro mirror at the bottom sends it back up.  LMT clock sequences need
  # pulses travelling in both directions, so the retro mirror is on by default.
  steering_mirror:
    tip_tilt: true           # draw tip-tilt actuation arrows on the top fold mirror
  retro_mirror:
    show: true
    tip_tilt: true
  # Pivot point of the beam rotation: the steering mirror imaged by the
  # telescope; the beam turns about this point without translating there.
  pivot: {show: false, z: 0}
  beam:
    width: 0.16              # cm, full width inside the main tube
    input_width: 0.06        # cm, width before the telescope expands it
    arrow_gap: 0.04          # cm between beam edge and its direction arrows
    arrows_at: [0.5]         # where along the tube (0..1) to draw down/up arrow pairs
  atoms:
    show: true
    clouds: 4                # snapshots drawn along each trajectory
    cloud_radius: 0.05       # cm
    leg_gap: 0.06            # cm between the up and down legs of a fountain
    # Fountain trajectories, in metres: launched at `start`, turning at
    # `apex`, ending at `end`.  `dx` is the horizontal offset on the page.
    # An optional `id` creates the anchor `apex:<id>`.
    trajectories:
      - {start: 0, apex: 44, end: 2, dx: -0.03}
      - {start: 98, apex: 98, end: 56, dx: 0.03}

overview:
  height: 15.0               # cm spanned by the baseline
  node: {half_width: 0.48, half_height: 0.3}
  source:
    arm: 1.0                 # cm, length of the transport sidearm
    arm_radius: 0.08
    width: 0.8
    height: 0.62
  stub: 0.35                 # cm of tube between end nodes and mirror / telescope
  # Cut the tube at height z (m) and open a gap of `gap` cm with a vertical
  # ellipsis: the baseline continues but is not to scale (10 m ... 1 km).
  baseline_break: {show: false, z: 50, gap: 0.8}
  scale_bar:
    show: true
    style: dimension         # dimension (arrow between end nodes) | axis (ticked, numbered)
    step: 0                  # m between ticks; 0 = none (ticks would suggest the
                             # nodes and sidearms are drawn to scale - they are not)
    label: '{length:g} m'    # dimension: text on the arrow; axis: axis title ({length} = tube length)
    at: 0.5                  # dimension: where along the arrow (0..1) the text sits
    x: -0.75                 # cm, horizontal position
  label_column: {left: -3.0, right: 1.55, top: 17.5, bottom: -1.0}
  label_gap: 0.36            # cm, minimum vertical distance between labels
  labels:                    # see README for the list of anchors
    - {text: atom source, anchor: source:lower, side: left}
  markers: []                # [{n: 1, anchor: ..., dx: 0, dy: 0}]
  zoom:
    node: lower              # node shown enlarged in panel (b); null = none
    section_z: 50            # m, height of the cut shown in panel (c); null = none
  cycle_legend:
    show: true
    steps: [prepare, 'transport\,/\,launch', interrogate, detect]
    x: -2.6                  # cm, left end of the legend
    y: -1.3                  # cm below the bottom of the beam

node:
  # Panel (b): enlarged launch/detection node with its source sidearm.
  source_side: null         # left | right | null = same side as the zoomed node's source
  tube_radius: 0.42
  tube_length: 1.4           # cm of tube drawn above and below the node
  half_width: 0.95
  half_height: 0.68
  wall: 0.08
  arm: 1.25
  arm_radius: 0.2
  source: {width: 1.35, height: 1.1}
  # Pre-cooling stages feeding the 3D MOT, in the order the atoms pass
  # through them: any of oven, zeeman (Zeeman slower), mot2d (2D MOT).
  # Each registers an anchor of the same name.
  stages: [oven, mot2d]
  cameras: null              # list of sides (left/right); null = opposite the source
  beam_width: 0.26
  below: tube                # tube (shielded tube continues) | stub (bare stub, e.g. to the retro mirror)
  # crossed: two lattice beams crossing at a shallow angle, folded by mirrors
  # on a scaffold `scaffold` cm above and below the node (MAGIS, AION);
  # standing: a plain vertical standing wave along the axis
  launch_lattice: crossed
  scaffold: 0.75
  cross_half_width: 0.2      # cm, half the horizontal span of the crossed beams at the mirrors
  launch_arrow: true         # arrow showing the cloud launched upwards from the node
  label_column: {left: -4.6, right: 1.9, top: 1.0, bottom: -1.0}
  label_gap: 0.4
  labels: []
  markers: []

section:
  # Panel (c): cross-section of the interferometry region, outside -> in.
  # kind: square | ring | coils | beam | atoms
  # sides: number of polygon sides for rings (0 = circle)
  layers: []
  label_column: 2.3          # cm right of the centre
  label_gap: 0.4
  title: ""                  # optional caption under the section

trajectory:
  # Panel (d): height z versus time t for one shot.  Clouds released at t = 0
  # with z(t) = z0 + v0 t - g t^2/2.  Empty `clouds` = use the fountains and
  # drops of instrument.atoms (so panels (a) and (d) agree); otherwise a list
  # of {z0, v0, z_end, label} in m and m/s.  A cloud stops (is detected)
  # when it falls back to z_end.
  clouds: []
  label_clouds: false        # write each cloud's label (trajectory id) next to it
  g: 9.81
  width: 4.2                 # cm, plot area
  height: 3.6
  t_prepare: 1.0             # s of "preparation" shown before release (t < 0), schematic
  t_max: null                # s, end of the time axis (null: shortly after the last pulse)
  z_range: null              # [z_min, z_max] in m (null: fit the clouds)
  t_label: $t$
  z_label: $z$
  interferometer:
    t0: 0.3                  # s, first pulse
    T: 1.0                   # s, pulse separation
    pulses: [0, 1, 2]        # pulse times in units of T after t0
    labels: ['$\pi/2$', '$\pi$', '$\pi/2$']
    show_arms: true
    arm_labels: ['$|g\rangle$', '$|e\rangle$']   # unkicked / kicked arm of the top cloud; [] = none
    pulse_arrows: true       # small down/up arrows: each pulse travels down and back up
    show_T: true             # dimension arrow marking T between the first two pulses
    split: 3.0               # m/s, arm velocity difference (exaggerated for visibility)
  zoom: true                 # bracket in panel (a) marking the trajectories shown here
  # builtin: the clouds of panel (a) with a single pi/2-pi-pi/2 sequence.
  # mzplots: draw with mz-plots' LMT generator (github.com/noammouelle/mz-plots;
  # pip install -e it, or give its checkout as `path`): LMT pulse ladders,
  # alternating pulse directions, finite light travel time, gradiometer pair.
  engine: builtin
  mzplots:
    path: null               # mz-plots checkout (relative to detector_figure/) if not pip-installed
    fallback: true           # if mz-plots is missing, warn and use the builtin engine
    font: \scriptsize        # font of mz-plots' own labels inside the panel
    config: {}               # lmt_sequence_diagram.Config fields: n, T, gradiometer, c_pulse, ...
  zoom_at: 0.5               # where along that bracket (0..1) its letter sits

