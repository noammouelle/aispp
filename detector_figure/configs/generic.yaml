# Generic long-baseline atom-interferometric detector: the thesis overview
# figure.  Topology is the intersection of MAGIS-100 and AION-10: sources on
# sidearms feeding launch/detection nodes on one shielded vertical UHV tube,
# one common clock beam from the top (in-vacuum tip-tilt steering mirror,
# expanding telescope), retro-reflected by a tip-tilt mirror at the bottom so
# that LMT clock pulses can be applied from both directions.
#
# Panel (a) carries the instrument-scale labels; the source-scale labels
# (oven, MOT, transport and launch lattices, camera) live in panel (b) and the
# layer structure of the tube in panel (c).
#
# Text containing a comma must be quoted: {text: 'a\,b', ...}.

output:
  name: generic_detector

layout:
  # (b), (c) and (d) sit in the band to the right of the long tube
  panels: [overview, node, section, trajectory]
  trajectory: {x: 5.9, y: 10.0, letter: [-0.9, 4.9]}
  overview: {letter: [-3.3, 18.55]}
  node: {x: 5.75, y: 5.6, letter: [-4.1, 2.25]}
  section: {x: 5.7, y: 1.25, letter: [-1.6, 1.95]}

instrument:
  name: Generic detector
  baseline: 100
  # Two sources, at the bottom and partway up (AION-10-like); the tube and the
  # clock beam continue to the top.  Both clouds are launched upwards and
  # detected where they started (MAGIS modes B/C, AION).
  nodes:
    - {id: lower, z: 0, source: left}
    - {id: upper, z: 50, source: left}
  tube_extent: [0, 100]
  beam: {width: 0.13, arrows_at: [0.83, 0.17]}
  atoms:
    trajectories:   # the same two fountains appear in panel (d)
      - {id: lower, label: cloud 1, start: 0, apex: 32, end: 0.3, dx: -0.02}
      - {id: upper, label: cloud 2, start: 50, apex: 82, end: 50.3, dx: 0.02}

overview:
  label_column: {left: -0.5, right: 1.55, top: 16.25}
  labels:
    # anchor@z means "this element at height z (m)", e.g. shield@55
    - {text: atom source, anchor: source:upper.oven, side: top, dy: 0.13, line: 9.15}
    - {text: steering mirror\\(tip--tilt), anchor: fold, side: left}
    - {text: telescope, anchor: telescope, side: right}
    - {text: 'launch\,/\,detection\\node', anchor: node:upper, side: right}
    - {text: ultrahigh-vacuum\\interferometry region, anchor: tube@91, side: right}
    - {text: 'common clock beam\\(698\,nm, finite waist)', anchor: beam, side: right}
    - {text: bias-field coils, anchor: coil@70, side: right}
    - {text: magnetic shield, anchor: shield@62, side: right}
    - {text: retro-reflection mirror\\(tip--tilt), anchor: mirror, side: right}
  markers:
    - {n: 1, anchor: source:lower.mot, dy: 0.66}
    - {n: 2, anchor: arm:lower, dx: 0.25, dy: 0.66}
    - {n: 3, anchor: apex:lower, dx: 0.65, dy: -0.6, leader: true}
    - {n: 4, anchor: node:lower.camera, dx: 0.05, dy: 0.62}
  zoom: {node: lower, section_z: 18}
  # not to scale: the same layout serves 10 m, 100 m and km baselines
  baseline_break: {show: true, z: 40, gap: 0.8}
  scale_bar: {label: '$\sim 10\,$m -- $1\,$km', at: 0.72, x: -1.0}

node:
  below: stub          # (b) is the bottom node: only a bare stub to the retro mirror below it
  arm: 1.0
  source: {width: 1.2, height: 1.05}
  label_column: {left: -4.2, right: 2.0, top: 1.05, bottom: -1.0}
  labels:
    - {text: oven, anchor: oven, side: top}
    - {text: 2D MOT, anchor: mot2d, side: top}
    - {text: 3D MOT, anchor: mot, side: top}
    - {text: transport lattice, anchor: transport, side: bottom, shift: -0.45}
    - {text: launch lattice, anchor: launch, side: right, shift: -0.15}
    - {text: camera, anchor: camera, side: right}
    - {text: clock beam, anchor: beam, side: right}
    - {text: returning atoms, anchor: atoms, side: right}
  markers:
    - {n: 1, anchor: mot, dx: -0.6, dy: 0.65}
    - {n: 2, anchor: transport, dx: 0.1, dy: -0.4}
    - {n: 3, anchor: tube@1.55, dx: -1.25}
    - {n: 4, anchor: camera, dx: -0.3, dy: 0.35}

section:
  label_column: 1.9
  layers:   # outside -> in
    - {kind: square, size: 1.45, thickness: 0.07, label: structural support}
    - {kind: ring, radius: 1.15, thickness: 0.06, color: shield, label: magnetic shield}
    - {kind: coils, radius: 0.85, count: 18, wire: 0.045, label: bias-field coils}
    - {kind: ring, radius: 0.62, thickness: 0.07, color: metal, label: UHV tube}
    - {kind: vacuum, radius: 0.55}
    - {kind: beam, radius: 0.24, label: clock beam (cm waist), side: left}
    - {kind: atoms, radius: 0.07, label: atom clouds, side: left}

trajectory:
  # Drawn by mz-plots (github.com/noammouelle/mz-plots): an LMT (n = 3)
  # gradiometer with finite light travel time - pulses alternate direction
  # (down from the telescope, up from the retro mirror) and reach the upper
  # cloud L/c later.  Falls back to the built-in panel if mz-plots is missing.
  engine: mzplots
  mzplots:
    path: ../../mz-plots     # relative to detector_figure/; not needed if pip-installed
    config: {n: 3, T: [2.4], gradiometer: true, baseline: 3.0, c_pulse: 30.0,
             dt: 0.4, v0: 1.2, dv: 0.5, g: 0.3, tail: 0.8, show_lmt_labels: true,
             show_ports: true, show_state_labels: false}
  width: 4.6
  height: 4.0
  label_clouds: true
  interferometer: {t0: 0.3, T: 2.1}
